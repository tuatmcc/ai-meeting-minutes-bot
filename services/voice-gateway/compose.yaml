services:
  voice-gateway:
    build:
      context: ../..
      dockerfile: services/voice-gateway/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - production.env
    networks:
      - server
      - asr

networks:
  server:
    external: true
    name: server_default
  asr:
    external: true
    name: asr_default
