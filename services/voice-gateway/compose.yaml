services:
  voice-gateway:
    build:
      context: ../..
      dockerfile: services/voice-gateway/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - production.env
    volumes:
      - recordings:/app/services/voice-gateway/var/recordings
    networks:
      - server

networks:
  server:
    external: true
    name: server_default

volumes:
  recordings:
