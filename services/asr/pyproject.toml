[project]
name = "meeting-asr"
version = "0.1.0"
description = "GPU-side Discord voice capture and speech recognition service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "numpy>=1.26,<3", "python-multipart>=0.0.20,<1", "uvicorn[standard]>=0.34,<1"]

[project.scripts]
meeting-asr = "meeting_asr.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.9"]
