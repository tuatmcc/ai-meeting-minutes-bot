name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@e0ed22ae4d909f13ed5d2688513f73e1875e46db # v3.0.0
        with:
          version: 11.27.0
          runtime: node@24
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/asr/uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --locked --directory services/asr

      - name: Check TypeScript formatting
        run: pnpm fmt:check:ts

      - name: Check Python formatting
        run: pnpm fmt:check:python

      - name: Lint TypeScript
        run: pnpm lint:ts

      - name: Lint Python
        run: pnpm lint:python
