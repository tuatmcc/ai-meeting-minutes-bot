name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.27.0
          runtime: node@24
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/asr/uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --locked --directory services/asr

      - name: Check TypeScript formatting
        run: pnpm fmt:check:ts

      - name: Check Python formatting
        run: pnpm fmt:check:python

      - name: Lint TypeScript
        run: pnpm lint:ts

      - name: Lint Python
        run: pnpm lint:python

  deploy-worker:
    name: Deploy Worker
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.27.0
          runtime: node@24
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Discord command registration secret
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::Add DISCORD_BOT_TOKEN to GitHub repository secrets before deploying the Worker."
            exit 1
          fi
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      - name: Deploy Worker
        run: pnpm deploy:worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Register Discord application commands
        run: pnpm --filter @ai-meeting-minutes/worker register:commands
        env:
          DISCORD_APPLICATION_ID: '1552896143392907294'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
